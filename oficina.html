<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oficina">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#241d2c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Oficina de Claude · Monitoreo</title>
<style>
:root{
  --fondo:#17131d; --barra:#241d2c; --borde:#0c090f; --texto:#f3e9d7; --tenue:#a99a8b;
  --verde:#6fd36f; --rojo:#ff6b5b; --naranja:#d97757; --s:2;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fondo);color:var(--texto);
  font-family:Consolas,"Lucida Console","Courier New",monospace;overflow:hidden}
header{position:fixed;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:20px;
  padding:0 16px;background:var(--barra);border-bottom:4px solid var(--borde);font-size:14px;white-space:nowrap;z-index:5}
.titulo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:2px;font-size:15px}
.logo{width:16px;height:16px;background:var(--naranja);box-shadow:0 0 0 2px #2a1a14,inset -3px -3px 0 #b4573a}
.senal{display:flex;align-items:center;gap:8px;color:var(--tenue)}
.senal .punto{width:10px;height:10px;background:var(--tenue)}
.senal.ok{color:var(--texto)}
.senal.ok .punto{background:var(--verde);animation:latido 1.2s steps(2,end) infinite}
.senal.mal{color:var(--rojo)}
.senal.mal .punto{background:var(--rojo)}
@keyframes latido{50%{opacity:.3}}
.derecha{margin-left:auto;display:flex;gap:20px;color:var(--tenue);overflow:hidden}
#reloj{color:var(--texto)}
#escenario{position:fixed;top:50px;left:0;right:0;bottom:0;overflow:auto;padding:12px 0 calc(56px + env(safe-area-inset-bottom,0px));
  scroll-behavior:smooth;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#zoomTip{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;
  background:rgba(23,19,29,.86);color:var(--tenue);font:12px/1.3 -apple-system,system-ui,"Segoe UI",sans-serif;padding:6px 9px;pointer-events:none}
.nombre .ultra{font-style:normal;font-weight:800;color:#0b1d4d;background:#7fe7ff;padding:0 calc(var(--s)*1px);margin-left:calc(var(--s)*1.5px);letter-spacing:.06em}
.nombre small{display:block;font-size:.82em;color:#cfe9c9;letter-spacing:.02em}
.origen{display:inline-block;font:700 11px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding:1px 7px;margin-right:6px;letter-spacing:.04em}
.origen.tableta{background:#3ddc84;color:#0d2a1a}
.origen.laptop{background:#d97757;color:#1a120e}
.origen.borrado{background:#5a4a5f;color:#e9dcef}
@media (max-width:760px){
  header{height:auto;flex-wrap:wrap;gap:6px 12px;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));
    font-family:-apple-system,system-ui,"Segoe UI",sans-serif}
  .titulo{font-size:14px;letter-spacing:1px}
  .derecha{display:none}
  .pisos{order:3;width:100%;overflow-x:auto}
  .pisos button{flex:1;font-size:13px;padding:8px 6px;white-space:nowrap}
  #panel{top:auto;left:0;width:100%;max-height:72vh;border-left:0;border-top:4px solid var(--borde);transform:translateY(105%);
    padding-bottom:env(safe-area-inset-bottom,0px)}
  #panelCuerpo{font-size:15px}
  #bajar{display:none}
}
#mundo{position:relative;margin:0 auto}
#lienzo{display:block;image-rendering:pixelated;box-shadow:0 0 0 4px var(--borde)}
#capa{position:absolute;inset:0;pointer-events:none}

/* Viñeta de cómic: blanca, borde negro de pixel, cola en escalón */
.vineta{position:absolute;left:0;top:0;background:#fff;color:#151015;font-weight:700;
  font-size:max(11px,calc(var(--s)*5.2px));line-height:1.18;text-align:center;
  padding:calc(var(--s)*1.5px) calc(var(--s)*2.5px);
  width:max-content;max-width:max(120px,calc(var(--s)*88px));
  box-shadow:0 calc(var(--s)*-1px) 0 #151015,0 calc(var(--s)*1px) 0 #151015,
             calc(var(--s)*-1px) 0 0 #151015,calc(var(--s)*1px) 0 0 #151015;
  z-index:3}
.vineta .cola{position:absolute;top:100%;left:0;width:calc(var(--s)*7px);height:calc(var(--s)*4px);display:block}
.vineta.pop{animation:pop .3s steps(3,end)}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.vineta.puntos i{font-style:normal;animation:punto 1.2s infinite;opacity:.2}
.vineta.puntos i:nth-child(2){animation-delay:.2s}
.vineta.puntos i:nth-child(3){animation-delay:.4s}
@keyframes punto{0%,100%{opacity:.2}40%{opacity:1}}

/* Gafete con el nombre debajo de cada monito */
.nombre{position:absolute;left:0;top:0;transform:translateX(-50%);white-space:nowrap;color:#fff;
  font-size:max(9px,calc(var(--s)*3.6px));line-height:1.25;padding:0 calc(var(--s)*1.5px);
  background:rgba(18,12,18,.8);border-left:calc(var(--s)*1.5px) solid var(--c,#d97757);z-index:2}
.nombre i{font-style:normal;font-weight:700;margin-left:calc(var(--s)*1.5px)}
.nombre b{display:inline-block;width:calc(var(--s)*2px);height:calc(var(--s)*2px);min-width:4px;min-height:4px;
  margin-left:calc(var(--s)*1.5px);background:var(--e,#6fd36f);vertical-align:middle}

/* Letreros de las áreas */
.letrero{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;background:#6b4426;color:#ffe3b8;
  font-weight:700;letter-spacing:.08em;font-size:max(9px,calc(var(--s)*4.2px));line-height:1.25;
  padding:calc(var(--s)*.8px) calc(var(--s)*2.6px);
  box-shadow:0 calc(var(--s)*-1px) 0 #2e1b0e,0 calc(var(--s)*1px) 0 #2e1b0e,
             calc(var(--s)*-1px) 0 0 #2e1b0e,calc(var(--s)*1px) 0 0 #2e1b0e,inset 0 calc(var(--s)*-1px) 0 #4e2f18;z-index:1}
.letrero.activo{background:#93602f;color:#fff8e1}
.letrero.activo::after{content:"";position:absolute;right:calc(var(--s)*-4px);top:50%;width:calc(var(--s)*2px);height:calc(var(--s)*2px);
  margin-top:calc(var(--s)*-1px);background:#7dff8a;box-shadow:0 0 0 calc(var(--s)*.5px) #1f5a2a}

.vacia{position:absolute;left:50%;top:22.1%;transform:translate(-50%,-50%);background:rgba(23,19,29,.88);color:#f3e9d7;
  font-size:max(11px,calc(var(--s)*4.6px));padding:calc(var(--s)*2px) calc(var(--s)*4px);display:none;z-index:2;white-space:nowrap}
.aviso{position:fixed;top:50px;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:rgba(10,8,14,.84);z-index:10;padding:16px}
.aviso div{max-width:560px;background:#fff;color:#151015;padding:22px 26px;font-size:16px;line-height:1.55;
  box-shadow:0 -4px 0 #151015,0 4px 0 #151015,-4px 0 0 #151015,4px 0 0 #151015}
.aviso b{color:#b4573a}

/* Botones para ir de piso en piso */
.pisos{display:flex;gap:6px}
.pisos button,#bajar{background:#3a2f48;color:var(--texto);border:0;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;box-shadow:0 2px 0 #120e17}
.pisos button:hover,#bajar:hover{background:#4a3d5c}
#bajar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;font-size:13px;padding:8px 14px;background:var(--naranja);color:#1a120e;font-weight:700}
#bajar.oculto{display:none}

/* Letrero que sale al pasar el mouse sobre algo que se puede picar */
#tip{position:fixed;z-index:9;pointer-events:none;background:#151015;color:#fff;font-size:12px;padding:4px 8px;display:none;
  box-shadow:0 0 0 2px #f3e9d7;white-space:nowrap}

/* Panel lateral: fichas, Cerebro Delta, proyectos, cuartos vacíos */
#panel{position:fixed;top:50px;right:0;bottom:0;width:min(420px,100vw);background:#1f1927;border-left:4px solid var(--borde);z-index:8;
  transform:translateX(105%);transition:transform .18s ease-out;display:flex;flex-direction:column;
  font-family:"Segoe UI",system-ui,sans-serif;color:var(--texto)}
#panel.abierto{transform:none}
.cabeza{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#2a2234;border-bottom:3px solid var(--borde)}
#panelTitulo{font-family:Consolas,monospace;font-weight:700;letter-spacing:1px;flex:1;font-size:15px}
.cerrar{background:#3a2f48;color:var(--texto);border:0;width:30px;height:30px;font-size:16px;cursor:pointer}
#panelCuerpo{overflow-y:auto;padding:12px 14px 28px;flex:1;font-size:14px;line-height:1.45}
.pestanas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pestanas button,.boton{background:#3a2f48;color:var(--texto);border:0;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;
  box-shadow:0 2px 0 #120e17;text-decoration:none;display:inline-block}
.pestanas button.activo{background:var(--naranja);color:#1a120e;font-weight:700}
.boton.principal{background:var(--naranja);color:#1a120e;font-weight:700}
.botones{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.item{display:block;box-sizing:border-box;text-decoration:none;width:100%;text-align:left;background:#2a2234;border:0;color:var(--texto);padding:8px 10px;margin:0 0 6px;cursor:pointer;font:inherit}
.item:hover{background:#352b42}
.item small,.meta{display:block;color:var(--tenue);font-size:12px;margin-top:2px}
.buscar,.campo{width:100%;padding:7px 9px;background:#120e17;border:2px solid #3a2f48;color:var(--texto);font:inherit;margin-bottom:10px}
textarea.campo{min-height:70px;resize:vertical}
.nota{white-space:pre-wrap;line-height:1.5;background:#17121d;padding:12px;margin-top:10px;word-break:break-word}
.nota a,a.enlace{color:#c9a6ff;cursor:pointer;text-decoration:underline}
.tarjeta{background:#2a2234;padding:10px 12px;margin-bottom:8px;border-left:4px solid var(--naranja)}
.tarjeta b{display:block;margin-bottom:2px}
.tarjeta div{font-size:13px;color:#d9cdbb;margin-top:3px}
.tarjeta i{font-style:normal;color:var(--tenue)}
.fila{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #2f2738}
.fila span:first-child{color:var(--tenue)}
.vacio{color:var(--tenue);font-style:italic}
</style>
</head>
<body>
<header>
  <div class="titulo"><span class="logo"></span>OFICINA · MONITOREO</div>
  <div class="senal" id="senal"><span class="punto"></span><span id="senalTexto">Conectando…</span></div>
  <nav class="pisos"><button data-fila="0">Planta principal</button><button data-fila="21">Calleros · Cerebro</button><button data-fila="37">Ampliación</button></nav>
  <div class="derecha"><span id="ultimo"></span><span id="cuantos"></span><span id="reloj"></span></div>
</header>
<div id="tip"></div>
<button id="bajar">↓ Baja: Oficina Calleros y Cerebro Delta</button>
<div id="zoomTip">Pellizca para acercar</div>
<aside id="panel" aria-label="Detalles">
  <div class="cabeza"><span id="panelTitulo"></span><button class="cerrar" id="panelCerrar" title="Cerrar (Esc)">✕</button></div>
  <div id="panelCuerpo"></div>
</aside>
<div id="escenario">
  <div id="mundo">
    <canvas id="lienzo"></canvas>
    <div id="capa"><div class="vacia" id="vacia">Nadie trabajando por ahora</div></div>
  </div>
</div>
<div class="aviso" id="aviso"><div id="avisoTexto">
  Esta oficina se abre con <b>iniciar_oficina.bat</b> (doble clic).<br>
  Así el navegador puede leer <b>estado.json</b> cada segundo.<br><br>
  Si ya lo abriste, entra a: <b>http://localhost:8765/oficina.html</b>
</div></div>

<script>
(() => {
'use strict';

/* =====================================================================
   OFICINA DE CLAUDE — solo MUESTRA lo que dice estado.json.
   No inventa agentes ni actividades.
   ===================================================================== */

/* ---------- Ajustes ---------- */
const T = 16, COLS = 32, ROWS = 52, W = COLS * T, H = ROWS * T;
const FILAS_ARRIBA = 22;        // la planta principal; lo demás se ve bajando con el scroll
const SEGUNDOS_INACTIVO = 60;   // sin reportar más de esto -> Descanso
/* De dónde lee: en la laptop, estado.json del servidor local; en el teléfono (GitHub Pages),
   el repo PRIVADO de estado con la llave de solo lectura que trae el QR. La página nunca escribe. */
const EN_NUBE = location.protocol !== 'file:' && !['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
const NUBE = {
  estado: 'https://api.github.com/repos/KALLEROS/oficina-cloud-monitoreo-estado/contents/estado.json',
  terrazas: 'https://api.github.com/repos/daniterrazas01-source/dragtrim/contents/oficina/estado-terrazas.json?ref=claude/oficina-estado',
};
const CADA_MS = EN_NUBE ? 15000 : 2000;   // el teléfono revisa cada 15 s (nunca más de 20 s)
const LLAVE = (() => {
  let k = null;
  const m = location.hash.match(/[#&]k=([A-Za-z0-9_]+)/);
  try {
    if (m){ localStorage.setItem('oficina-llave', m[1]); history.replaceState(null, '', location.pathname); }
    k = localStorage.getItem('oficina-llave');
  } catch (e) { k = m ? m[1] : null; }
  return k;
})();
const VELOCIDAD = 100;          // pixeles por segundo al caminar
const AVISO = 0.35;             // segundos con "!" antes de levantarse
const FPS = 30;                 // cuadros por segundo (ahorra batería)
const ENTRADA = { tx: 31, ty: 11 };
const K = '#2a1a14';            // color de contorno

const lienzo = document.getElementById('lienzo');
const ctx = lienzo.getContext('2d');
const capa = document.getElementById('capa');
let g = ctx;                    // contexto donde se dibuja ahorita
let escala = 2, k = 2, zoom = 1;

function R(x, y, w, h, c){ g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
function tono(hex, d){
  const n = parseInt(hex.slice(1), 16), f = v => Math.max(0, Math.min(255, v + d));
  return '#' + ((1 << 24) | (f(n >> 16) << 16) | (f((n >> 8) & 255) << 8) | f(n & 255)).toString(16).slice(1);
}
function azar(sem){ let s = sem | 0; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashTexto(s){ let h = 2166136261; for (const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }
function sinAcentos(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function linea(x0, y0, x1, y1, c){
  let dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx + dy;
  for (;;){ R(x0, y0, 1, 1, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy){ err += dy; x0 += sx; } if (e2 <= dx){ err += dx; y0 += sy; } }
}

/* ---------- Mapa (32 x 22 casillas de 16 px) ----------
   # muro   = pared vista de frente   D puerta   E entrada
   b biblioteca  e escritorio  i internet  j sala de juntas  d descanso  h pasillo */
const MAPA = (() => {
  const m = Array.from({ length: ROWS }, () => Array(COLS).fill('#'));
  const llenar = (x0, y0, x1, y1, c) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) m[y][x] = c; };
  llenar(1, 1, 9, 1, '='); llenar(11, 1, 20, 1, '='); llenar(22, 1, 30, 1, '=');
  llenar(1, 2, 9, 8, 'b'); llenar(11, 2, 20, 8, 'e'); llenar(22, 2, 30, 8, 'i');
  llenar(1, 10, 30, 10, '='); llenar(1, 11, 30, 12, 'h');
  m[11][31] = 'E'; m[12][31] = 'E';
  llenar(1, 14, 14, 14, '='); llenar(16, 14, 30, 14, '=');
  llenar(1, 15, 14, 20, 'j'); llenar(16, 15, 30, 20, 'd');
  for (const x of [5, 6, 15, 16, 26, 27]){ m[9][x] = 'D'; m[10][x] = 'D'; }
  for (const x of [7, 8, 22, 23]){ m[13][x] = 'D'; m[14][x] = 'D'; }
  // ---- Planta de abajo: pasillo 2, Oficina Calleros, Cerebro Delta y la ampliación ----
  // c = Oficina Calleros   x = Cerebro Delta   v = cuarto vacío (en obra)
  m[21][22] = 'D'; m[21][23] = 'D';                       // puerta desde Descanso
  llenar(1, 22, 30, 22, '='); m[22][22] = 'D'; m[22][23] = 'D';
  llenar(1, 23, 30, 24, 'h');
  llenar(1, 26, 12, 26, '='); llenar(17, 26, 30, 26, '=');
  llenar(1, 27, 12, 36, 'c'); llenar(14, 27, 15, 36, 'h'); llenar(17, 27, 30, 36, 'x');
  for (const x of [6, 7, 14, 15, 23, 24]){ m[25][x] = 'D'; m[26][x] = 'D'; }
  for (const x of [14, 15]){ m[37][x] = 'D'; m[38][x] = 'D'; }
  llenar(1, 38, 13, 38, '='); llenar(16, 38, 30, 38, '=');
  llenar(1, 39, 30, 40, 'h');
  llenar(1, 42, 9, 42, '='); llenar(11, 42, 20, 42, '='); llenar(22, 42, 30, 42, '=');
  llenar(1, 43, 9, 50, 't'); llenar(11, 43, 20, 50, 'v'); llenar(22, 43, 30, 50, 'v');   // t = Oficina Terrazas
  for (const x of [4, 5, 15, 16, 25, 26]){ m[41][x] = 'D'; m[42][x] = 'D'; }
  return m;
})();
const CAMINABLE = new Set(['h', 'b', 'e', 'i', 'j', 'd', 'D', 'E', 'c', 'x', 'v', 't']);
const BLOQUEO = new Set();
function bloquear(x0, y0, x1 = x0, y1 = y0){ for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) BLOQUEO.add(y * COLS + x); }
function caminable(x, y){ return x >= 0 && y >= 0 && x < COLS && y < ROWS && CAMINABLE.has(MAPA[y][x]) && !BLOQUEO.has(y * COLS + x); }

/* ---------- Áreas y lugares donde se sienta/para cada agente ---------- */
const AREAS = {
  'escritorio':     { letrero: 'ESCRITORIO',     x0: 11, y0: 2,  x1: 20, y1: 8,  lx: 208, ly: 168, pose: 'teclear' },
  'biblioteca':     { letrero: 'BIBLIOTECA',     x0: 1,  y0: 2,  x1: 9,  y1: 8,  lx: 48,  ly: 168, pose: 'leer' },
  'internet':       { letrero: 'INTERNET',       x0: 22, y0: 2,  x1: 30, y1: 8,  lx: 384, ly: 168, pose: 'teclear' },
  'sala de juntas': { letrero: 'SALA DE JUNTAS', x0: 1,  y0: 15, x1: 14, y1: 20, lx: 64,  ly: 210, pose: 'hablar' },
  'descanso':       { letrero: 'DESCANSO',       x0: 16, y0: 15, x1: 30, y1: 20, lx: 304, ly: 210, pose: 'descansar' },
  'calleros':       { letrero: 'OFICINA CALLEROS', x0: 1, y0: 27, x1: 12, y1: 36, lx: 56,  ly: 408, pose: 'teclear' },
  'cerebro delta':  { letrero: 'CEREBRO DELTA',  x0: 17, y0: 27, x1: 30, y1: 36, lx: 316, ly: 408, pose: 'leer' },
  'terrazas':       { letrero: 'OFICINA TERRAZAS', x0: 1, y0: 43, x1: 9, y1: 50, lx: 80, ly: 664, pose: 'teclear' },
};
const L = (tx, ty, dir, extra = {}) => Object.assign({ tx, ty, ox: 0, oy: 0, dir, sentado: false, silla: null }, extra);
const LUGARES = {
  'escritorio': [
    L(12, 4, 'arriba', { ox: 8, oy: -3, sentado: true, silla: 'oficina' }),
    L(15, 4, 'arriba', { ox: 8, oy: -3, sentado: true, silla: 'oficina' }),
    L(18, 4, 'arriba', { ox: 8, oy: -3, sentado: true, silla: 'oficina' }),
    L(12, 7, 'arriba', { ox: 8, oy: -3, sentado: true, silla: 'oficina' }),
    L(15, 7, 'arriba', { ox: 8, oy: -3, sentado: true, silla: 'oficina' }),
    L(18, 7, 'arriba', { ox: 8, oy: -3, sentado: true, silla: 'oficina' }),
  ],
  'biblioteca': [
    L(5, 4, 'abajo', { oy: 6, sentado: true, silla: 'madera' }),

function normalizarArea(a){
  const s = sinAcentos(a).toLowerCase().replace(/[_\-]+/g, ' ').replace(/\s+/g, ' ').trim();
  if (!s) return null;
  if (s.includes('calleros')) return 'calleros';
  if (s.includes('cerebro')) return 'cerebro delta';
  if (s.includes('terraza')) return 'terrazas';
  if (s.includes('junta') || s === 'sala' || s.includes('reunion')) return 'sala de juntas';
  if (s.startsWith('escritorio') || s === 'computadora') return 'escritorio';
  if (s.startsWith('biblio')) return 'biblioteca';
  if (s.startsWith('internet') || s === 'web') return 'internet';
  if (s.startsWith('descanso')) return 'descanso';
  return null;
}
function textoBreve(s){
  s = String(s || '').replace(/\s+/g, ' ').trim();
  if (!s) return '';
  const p = s.split(' ');
  let out = p.slice(0, 10).join(' ');
  if (out.length > 60) out = out.slice(0, 58).trimEnd() + '…';
  else if (p.length > 10) out += '…';
  return out;
}

function cerebroGrande(t){
  const cx = 384, cy = 497;
  const activo = hayAlguien('cerebro delta');
  const pulso = 0.5 + 0.5 * Math.sin(t * (activo ? 4 : 1.5));
  // pedestal
  R(360, 511, 48, 16, K); R(361, 512, 46, 14, '#2d2547'); R(361, 512, 46, 2, '#4a3f73'); R(366, 520, 36, 2, '#6b4fd8');
  // brillo alrededor
  g.globalAlpha = 0.12 + 0.18 * pulso;
  for (let yy = -14; yy <= 14; yy++){ const m = Math.round(22 * Math.sqrt(Math.max(0, 1 - (yy / 14) ** 2))); R(cx - m, cy + yy, m * 2, 1, '#b48cff'); }
  g.globalAlpha = 1;
  // el cerebro
  for (let yy = -11; yy <= 11; yy++){ const m = Math.round(17 * Math.sqrt(Math.max(0, 1 - (yy / 11.5) ** 2))); R(cx - m - 1, cy + yy, m * 2 + 2, 1, K); }
  for (let yy = -10; yy <= 10; yy++){
    const m = Math.round(16 * Math.sqrt(Math.max(0, 1 - (yy / 10.5) ** 2)));
    R(cx - m, cy + yy, m * 2, 1, yy < -5 ? '#e3b6ff' : '#cf96f5');
  }
  R(cx - 1, cy - 10, 2, 20, '#8a4fc7');                                       // la rayita del centro
  for (let i = 0; i < 6; i++){                                                // pliegues
    const yy = cy - 7 + i * 3;
    for (const lado of [-1, 1]){ for (let k = 0; k < 4; k++) R(cx + lado * (4 + k * 3), yy + ((k + i) % 2), 2, 1, '#9a5fe0'); }
  }
  // chispas de sinapsis
  for (let i = 0; i < (activo ? 6 : 3); i++){
    const f = (t * (activo ? 1.4 : 0.6) + i / 6) % 1, ang = i * 1.05 + t * 0.7;
    g.globalAlpha = 1 - f;
    R(Math.round(cx + Math.cos(ang) * (18 + f * 10)), Math.round(cy + Math.sin(ang) * (10 + f * 8)), 2, 2, '#8ff5ff');
  }
  g.globalAlpha = 1;
}

    if (!id || vistos.has(id)) continue;
    vistos.add(id);
    let a = agentes.get(id);
    const nuevo = !a;
    if (nuevo){ a = crearAgente(id, r); agentes.set(id, a); }
    const nombreVisible = String(r.nombre || '').trim() || (id.charAt(0).toUpperCase() + id.slice(1));
    const modelo = String(r.modelo || '').toLowerCase();
    a.modelo = MODELOS[modelo] ? modelo : null;
    a.tableta = esTableta(r);
    a.dispositivo = a.tableta ? 'Terrazas — Tableta Android' : (r.dispositivo || r.origen) ? 'Calleros — Laptop' : '';
    a.ultraPedido = String(r.modo || '').toLowerCase() === 'ultra' || !!r.ultra;
    const firma = (r.area || '') + '|' + (r.actividad || '') + '|' + (r.actualizado || '');
    if (firma !== a.firma){ a.firma = firma; a.vistoCambio = ahora; }
    const ts = fecha(r.actualizado) ?? raizTs ?? a.vistoCambio;
    if (ts > masReciente) masReciente = ts;
    a.ts = ts;
    const inactivo = (ahora - ts) / 1000 > SEGUNDOS_INACTIVO;
    let area = normalizarArea(r.area) || 'escritorio';
    if (a.tableta) area = 'terrazas';                 // lo de la tableta nunca se mezcla con la oficina principal
    else if (area === 'terrazas') area = 'escritorio';
    let texto = textoBreve(r.actividad);
    if (inactivo){ area = a.tableta ? 'terrazas' : 'descanso'; texto = 'Esperando instrucciones'; }   // Terrazas espera en su cuarto
    else if (area === 'descanso' && !texto) texto = 'Esperando instrucciones';
    const estado = inactivo ? 'inactivo' : String(r.estado || 'trabajando').toLowerCase();
    a.elNombre.style.setProperty('--e', ESTADO_COLOR[estado] || ESTADO_COLOR.trabajando);
    a.estadoTxt = estado;
    a.zzz = area === 'descanso' && (inactivo || estado === 'esperando');
    a.ultra = a.ultraPedido && !inactivo;
    ponerNombre(a, nombreVisible);
    if (nuevo){ if (primeraLectura) colocar(a, area, texto); else entrar(a, area, texto); }
    else if (a.fase === 'saliendo') irA(a, area, texto);
    else if (area !== a.areaDestino) irA(a, area, texto);
    else if (texto !== a.textoPendiente){ a.textoPendiente = texto; if (a.fase === 'trabajando') ponerTexto(a, texto, true); }
  }
  for (const a of agentes.values()) if (!vistos.has(a.id) && a.fase !== 'saliendo') salir(a);
  ultimoReporte = masReciente;
  primeraLectura = false;
}
const esTableta = r => /tableta|android/i.test(String(r.dispositivo || r.origen || ''));
async function leerJSON(url, conLlave){
  const h = conLlave ? { Authorization: 'Bearer ' + LLAVE, Accept: 'application/vnd.github.raw+json' } : {};
  const r = await fetch(url, { cache: 'no-store', headers: h });
  if (!r.ok){ const e = new Error('HTTP ' + r.status); e.codigo = r.status; throw e; }
  return JSON.parse((await r.text()).replace(/^﻿/, ''));
}
/* Junta lo de la laptop (Calleros) con lo de la tableta (Terrazas), sin mezclarlos */
function juntar(base, terr){
  const datos = Object.assign({}, base);
  let agentes = Array.isArray(base.agentes) ? base.agentes.slice() : [];
  let archivos = Array.isArray(base.archivos_recientes) ? base.archivos_recientes.slice() : [];
  if (terr && terr.agente){
    agentes = agentes.filter(a => !esTableta(a)).concat([terr.agente]);
    archivos = archivos.filter(f => !esTableta(f)).concat(Array.isArray(terr.archivos_recientes) ? terr.archivos_recientes : []);
  }
  datos.agentes = agentes; datos.archivos_recientes = archivos;
  return datos;
}

/* ---------- Viñetas y gafetes (HTML encima del lienzo) ---------- */
function ubicarVinetas(){
  const lista = [];
  for (const a of agentes.values()){
    a.elNombre.style.left = (a.x * escala) + 'px';
    a.elNombre.style.top = ((a.y + 1) * escala) + 'px';
    const visible = a.modo !== 'oculta';
    a.el.style.display = visible ? '' : 'none';
    a.tallo = null;
    if (!visible) continue;
    if (a.medir){ a.bw = a.el.offsetWidth / escala; a.bh = a.el.offsetHeight / escala; a.medir = false; }
    const sentado = a.fase === 'trabajando' && a.lugar && a.lugar.sentado;
    const mm = modeloDe(a);
    const cabeza = Math.round(a.y) - (sentado ? mm.h : mm.h + 2) - (a.ultra ? 10 : 3);
    const izq = Math.max(2, Math.min(W - 2 - a.bw, Math.round(a.x - a.bw / 2)));
    const abajo = cabeza - 5;
    lista.push({ a, izq, abajo, arriba: abajo - a.bh, cabeza });
  }
  // Si dos viñetas chocan, la de más arriba se sube
  lista.sort((p, q) => q.abajo - p.abajo);
  const puestas = [];
  for (const b of lista){
    for (let vuelta = 0; vuelta < 12; vuelta++){
      let choco = false;
      for (const o of puestas){
        if (b.izq < o.izq + o.a.bw + 3 && b.izq + b.a.bw + 3 > o.izq && b.arriba < o.abajo + 6 && b.abajo + 6 > o.arriba){
          b.abajo = o.arriba - 6; b.arriba = b.abajo - b.a.bh; choco = true;
        }
      }
      if (!choco) break;
    }
    if (b.arriba < 2){ const d = 2 - b.arriba; b.arriba += d; b.abajo += d; }
    puestas.push(b);
  }
  for (const b of lista){
    const a = b.a;
    const colaX = Math.max(1, Math.min(a.bw - 8, Math.round(a.x - b.izq - 3.5)));
    a.el.style.left = (b.izq * escala) + 'px';
    a.el.style.top = (b.arriba * escala) + 'px';
    a.elCola.style.left = (colaX * escala) + 'px';
    a.el.style.transformOrigin = ((colaX + 3.5) * escala) + 'px 100%';
    const punta = b.abajo + 4;
    if (punta < b.cabeza - 1) a.tallo = { x: Math.round(b.izq + colaX + 3), y0: punta, y1: b.cabeza - 1 };
  }
}

    const z = zonaEncima, c = Math.floor(t * 4) % 2 ? '#ffe066' : '#fff6c2';
    for (let i = 0; i < z.w; i += 4){ R(z.x + i, z.y, 2, 1, c); R(z.x + i, z.y + z.h - 1, 2, 1, c); }
    for (let i = 0; i < z.h; i += 4){ R(z.x, z.y + i, 1, 2, c); R(z.x + z.w - 1, z.y + i, 1, 2, c); }
  }
}
let anterior = 0;
function bucle(ms){
  requestAnimationFrame(bucle);
  if (anterior && ms - anterior < 1000 / FPS - 2) return;
  const dt = anterior ? Math.min(1, (ms - anterior) / 1000) : 0;   // según el reloj real, aunque el navegador vaya lento
  anterior = ms;
  for (const a of [...agentes.values()]) moverAgente(a, dt);
  letrerosActivos();
  ubicarVinetas();
  dibujar(ms / 1000);
}

/* ---------- Arranque ---------- */
construirMuebles();
calcularCandidatos();
pintarEstatica();
ajustarEscala();
window.addEventListener('resize', ajustarEscala);
if (location.protocol === 'file:') $('aviso').style.display = 'flex';
document.addEventListener('visibilitychange', () => { if (!document.hidden) leerEstado(); });
leerEstado();
setInterval(leerEstado, CADA_MS);
if ('serviceWorker' in navigator && EN_NUBE) navigator.serviceWorker.register('sw.js').catch(() => {});
cargarDatos();
setInterval(cargarDatos, 60000);
setInterval(barra, 1000);
barra();
requestAnimationFrame(bucle);
})();
</script>
